name: NOAD
options:
  bundleIdPrefix: com.noad
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

targets:
  NOAD:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
          - "Info.plist"
      - path: Shared/AppConstants.swift
      - path: App/Resources/Rules
        buildPhase: resources
        type: group
    info:
      path: App/Info.plist
    entitlements:
      path: Shared/NOAD.entitlements
    settings:
      base:
        PRODUCT_NAME: NOAD
        PRODUCT_BUNDLE_IDENTIFIER: com.noad.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Shared/NOAD.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: NOADContentBlocker
      - target: NOADWebExtension

  NOADContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: ContentBlockerExtension/ContentBlockerRequestHandler.swift
      - path: Shared/AppConstants.swift
      - path: ContentBlockerExtension/emptyBlockerList.json
        buildPhase: resources
    info:
      path: ContentBlockerExtension/Info.plist
    entitlements:
      path: Shared/NOAD.entitlements
    settings:
      base:
        PRODUCT_NAME: NOADContentBlocker
        PRODUCT_BUNDLE_IDENTIFIER: com.noad.app.ContentBlocker
        INFOPLIST_FILE: ContentBlockerExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Shared/NOAD.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

  NOADWebExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WebExtension/SafariWebExtensionHandler.swift
      - path: Shared/AppConstants.swift
      - path: WebExtension/Resources/manifest.json
        buildPhase: resources
      - path: WebExtension/Resources/_locales
        buildPhase: resources
        type: folder
      - path: WebExtension/Resources/css
        buildPhase: resources
        type: folder
      - path: WebExtension/Resources/images
        buildPhase: resources
        type: folder
      - path: WebExtension/Resources/js
        buildPhase: resources
        type: folder
    info:
      path: WebExtension/Info.plist
    entitlements:
      path: Shared/NOAD.entitlements
    settings:
      base:
        PRODUCT_NAME: NOADWebExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.noad.app.WebExtension
        INFOPLIST_FILE: WebExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Shared/NOAD.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
